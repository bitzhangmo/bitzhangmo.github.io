<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" type="button" aria-label="关闭">&times;</button>
  <button class="lightbox-prev" type="button" aria-label="上一张">&#8249;</button>
  <button class="lightbox-next" type="button" aria-label="下一张">&#8250;</button>
  <img class="lightbox-img" src="" alt="">
  <div class="lightbox-caption"></div>
</div>

<script>
(function () {
  var items = [].slice.call(document.querySelectorAll('.photo-item'));
  if (!items.length) return;

  var box = document.getElementById('lightbox');
  var img = box.querySelector('.lightbox-img');
  var cap = box.querySelector('.lightbox-caption');
  var current = 0;

  function show(i) {
    current = (i + items.length) % items.length;
    var el = items[current];
    img.src = el.getAttribute('data-src');
    img.alt = el.getAttribute('data-caption') || '';
    cap.textContent = el.getAttribute('data-caption') || '';
    box.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function hide() {
    box.hidden = true;
    img.src = '';
    document.body.style.overflow = '';
  }

  items.forEach(function (el, i) {
    el.addEventListener('click', function () { show(i); });
  });

  box.querySelector('.lightbox-close').addEventListener('click', hide);
  box.querySelector('.lightbox-prev').addEventListener('click', function (e) {
    e.stopPropagation(); show(current - 1);
  });
  box.querySelector('.lightbox-next').addEventListener('click', function (e) {
    e.stopPropagation(); show(current + 1);
  });
  box.addEventListener('click', function (e) {
    if (e.target === box || e.target === img) hide();
  });

  document.addEventListener('keydown', function (e) {
    if (box.hidden) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>
